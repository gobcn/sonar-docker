[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
 
[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autostart=true
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
 
[program:sonar_poller]
directory=/usr/share/sonar_poller/src
command=/usr/bin/php /usr/share/sonar_poller/src/poller.php
priority=1
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
 
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
