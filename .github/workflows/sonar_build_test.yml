name: sonar_build_test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-linux:
    name: Test building container on Ubuntu
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Fetch sonar_poller tags
        working-directory: sonar_poller
        run: git fetch --tags

      - name: Get sonar_poller version
        id: version
        working-directory: sonar_poller
        run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"

      - name: Test build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: test-image:latest
          build-args: |
            SONAR_POLLER_VERSION=${{ steps.version.outputs.version }}

      - name: Start container
        run: docker run -d --name sonar-test -p 8443:443 test-image:latest
 
      - name: Wait for HTTPS
        run: |
          for i in $(seq 1 30); do
            if curl -fksS -o /dev/null https://localhost:8443/; then
              echo "HTTPS up after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::nginx did not respond on 443 within 60s"
          exit 1
 
      - name: Check services are running
        run: |
          sleep 10
          docker exec sonar-test supervisorctl status
          # supervisorctl exits non-zero if any program is not RUNNING
 
      - name: Show logs on failure
        if: failure()
        run: |
          docker logs sonar-test || true
          docker exec sonar-test sh -c 'tail -n 100 /var/log/supervisor/*.log' || true

  publish-image:
    name: Build and publish container image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch sonar_poller tags
        working-directory: sonar_poller
        run: git fetch --tags

      - name: Get sonar_poller version
        id: version
        working-directory: sonar_poller
        run: echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/gobcn/sonar-docker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SONAR_POLLER_VERSION=${{ steps.version.outputs.version }}
